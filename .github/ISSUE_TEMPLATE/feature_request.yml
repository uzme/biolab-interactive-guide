name: Feature request
description: BioLab tajribasini yaxshilash bo‘yicha taklif yuboring.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qaysi muammoni hal qiladi?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Taklif etilayotgan yechim
      description: Funksiya yoki o‘quv oqimi qanday ishlashini tasvirlang.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Muqobil variantlar
      description: Ko‘rib chiqilgan boshqa yechimlar bo‘lsa, yozing.
