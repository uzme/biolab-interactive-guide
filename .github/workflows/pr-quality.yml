name: Pull Request Quality

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate pull request title
    runs-on: ubuntu-latest
    steps:
      - name: Require a conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|chore|perf|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?:[[:space:]].+ ]]; then
            echo "Pull request title must follow: type: short description"
            echo "Allowed types: feat, fix, docs, refactor, test, chore, perf, ci, build, style, revert"
            exit 1
          fi
          echo "Valid pull request title: $PR_TITLE"
