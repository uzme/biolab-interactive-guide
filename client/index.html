<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="description" content="BioLab — biotexnologiya qurilmalarini interaktiv o‘rganish platformasi." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BioLab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BioLab — Qurilmalar katalogi</title>
    <link rel="icon" type="image/webp" href="/biolab-logo.webp" />
    <link rel="preload" as="image" href="/biolab-drive-assets/BIO-001-hero_local.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/biolab-drive-assets/BIO-002-hero_local.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/biolab-drive-assets/BIO-003-hero_local.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const analyticsEndpoint = "%VITE_ANALYTICS_ENDPOINT%";
      const analyticsWebsiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
      if (analyticsEndpoint.startsWith("http") && analyticsWebsiteId && !analyticsWebsiteId.startsWith("%")) {
        const analyticsScript = document.createElement("script");
        analyticsScript.defer = true;
        analyticsScript.src = `${analyticsEndpoint}/umami`;
        analyticsScript.dataset.websiteId = analyticsWebsiteId;
        document.head.appendChild(analyticsScript);
      }
    </script>
  </body>
</html>
